syntax = "proto3";

package trace;

option java_package = "org.seqra.cir.sast.dataflow.proto.trace";
option java_multiple_files = true;

// Result of one `cir-klee` invocation. Written by cir-klee when `--result=<path>`
// is supplied; read by KleeCirSeAnalyzer. Replaces the previous fragile stdout
// regex on `"abort failure"`.
message KleeResult {
  // True iff KLEE reported a native memory error (`*.ptr.err` / `*.free.err`)
  // along the guided path AND no edge precondition was violated (no
  // `*.abort.err`). The first condition is confirmation: a concrete realizable
  // path reaches the sink and dereferences the freed pointer (the sink is no
  // longer marked by an injected `klee_abort()` — KLEE's own use-after-free
  // detection is the signal). The second is refutation: a violated precondition
  // means the IFDS fact did not hold concretely, so the trace stems from the
  // analysis' over-approximation and is rejected.
  bool trace_confirmed = 1;

  // Per-stage wall-clock timings (ms). Zero if the stage did not run.
  double cir_to_llvm_ms = 2;
  double trace_guide_ms = 3;
  double trace_assert_ms = 4;
  double llvm_as_ms = 5;
  double klee_ms = 6;

  // KLEE statistics parsed from `<output-dir>/info`. Zero if parsing failed.
  uint64 klee_instructions = 7;
  uint64 klee_completed_paths = 8;
  uint64 klee_explored_paths = 9;

  // Absolute paths to native memory-error files (`*.ptr.err` / `*.free.err`)
  // KLEE produced — the use-after-free was reached. Necessary (but not on its
  // own sufficient) for `trace_confirmed`.
  repeated string klee_mem_err_files = 12;

  // Absolute paths to `*.abort.err` files from the per-edge `klee_abort()`
  // inserted by TraceAssertPass. Each marks a guided path on which an edge
  // precondition was concretely violated — the IFDS fact did not hold, so the
  // trace is over-approximated. Non-empty forces `trace_confirmed` to false.
  repeated string klee_abort_files = 10;
}
