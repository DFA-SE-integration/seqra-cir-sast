syntax = "proto3";

package ap;

option java_package = "org.seqra.cir.sast.dataflow.proto.ap";
option java_multiple_files = true;

message APBase {
  oneof value {
    This this = 1;
    LocalVar lv = 2;
    Argument arg = 3;
    Return ret = 4;
    Exception except = 5;
  }
}

message APAccessor {
  oneof value {
    TaintMarkAccessor taint_mark_acc = 1;
    FieldAccessor field_acc = 2;
    ElementAccessor elem_acc = 3;
    FinalAccessor final_acc = 4;
    AnyAccessor any_acc = 5;
    ReferenceAccessor ref_acc = 6;
  }
}

message This { }

message LocalVar { uint32 idx = 1; }

message Argument { uint32 idx = 1; }

message Return { }

message Exception { }

//Omitted (not relevant)
//message Constant { }
//message ClassStatic { }

message TaintMarkAccessor { string mark = 1; }

message FieldAccessor {
  string class_name = 1;
  string field_name = 2;
  string field_type = 3;
}

message ElementAccessor { }

message FinalAccessor { }

message AnyAccessor { }

message ReferenceAccessor { }